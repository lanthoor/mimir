name: bundling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/app/**"
      - "crates/app/ui/**"
      - ".github/workflows/bundling.yml"

concurrency:
  group: bundling-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    name: bundle (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: bundling-linux

      - name: Build
        run: cargo build --release -p mimir-app --features tauri

      - name: Bundle
        run: |
          cargo install --locked tauri-cli --version "^2.0" --root /tmp/tauri-cli
          /tmp/tauri-cli/bin/cargo tauri build --bundles appimage deb --no-bundle
        # `--no-bundle` is a fallback if the bundler needs an icon we don't ship;
        # flip to `tauri build` for full bundle artifacts.

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimir-linux-x86_64
          path: target/release/mimir
          if-no-files-found: error
          retention-days: 7
