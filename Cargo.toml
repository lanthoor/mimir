[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio",
    "crates/app",
    "crates/telemetry",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lanthoor/mimir"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"