[package]
name = "mimir-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mimir audio engine: decode, DSP, output."

[lints]
workspace = true

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
thiserror = "1"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"], optional = true }
mimir-telemetry = { path = "../telemetry" }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# rodio handles device open, ring buffer, and on-the-fly sample-rate
# conversion — the previous cpal + rubato stack pre-resampled the whole
# decoded buffer on the worker thread.
output = ["dep:rodio"]
