[package]
name = "mimir-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mimir host binary (Tauri shell in Tier 0)."

[lints]
workspace = true

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-core = { path = "../core" }
mimir-audio = { path = "../audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
r2d2 = "0.8"
dirs = "5"
tauri = { version = "2.0", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "2.0", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
tauri = ["dep:tauri", "dep:tauri-build"]
