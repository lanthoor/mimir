<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mimir</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="brand">mimir</h1>
      <nav>
        <button data-view="tracks" class="active">Tracks</button>
        <button data-view="albums">Albums</button>
        <button data-view="artists">Artists</button>
        <button data-view="genres">Genres</button>
        <button data-view="years">Years</button>
      </nav>
      <input id="search" type="search" placeholder="search…" />
      <button id="add-folder">+ folder</button>
    </header>

    <main>
      <div id="status" class="status" hidden></div>
      <div id="filter-bar" class="filter-bar" hidden></div>
      <section id="list" class="list"></section>
    </main>

    <footer class="now-playing">
      <span id="np-title">—</span>
      <span id="np-artist"></span>
      <div class="controls">
        <button id="prev" title="previous">⏮</button>
        <button id="play" title="play">▶</button>
        <button id="pause" title="pause">⏸</button>
        <button id="stop" title="stop">⏹</button>
        <button id="next" title="next">⏭</button>
      </div>
    </footer>

    <dialog id="add-folder-dialog">
      <form method="dialog">
        <label>
          Folder path
          <input id="add-folder-path" type="text" placeholder="/abs/path/to/music" />
        </label>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="add-folder-confirm" value="default">Add</button>
        </menu>
      </form>
    </dialog>

    <dialog id="edit-track-dialog">
      <form method="dialog" id="edit-track-form">
        <h2>Edit track</h2>
        <label>Title <input name="title" type="text" /></label>
        <label>Genre <input name="genre" type="text" /></label>
        <label>Year <input name="year" type="number" /></label>
        <label>Track # <input name="track_no" type="number" min="1" /></label>
        <label>Disc # <input name="disc_no" type="number" min="1" /></label>
        <menu>
          <button value="cancel">Cancel</button>
          <button id="edit-track-save" value="save">Save</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
